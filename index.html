<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#02040b" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Local Organizing Committee, RUDN University" />
    <!--ssr-head-->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Event",
            "@id": "https://spacescitech.com/#event",
            "name": "7th SciTech Forum on Space Engineering and Operations Support",
            "description": "7th SciTech Forum on Space Engineering and Operations Support is taking place on November 24-26, 2026 in RUDN University, Moscow, Russia",
            "startDate": "2026-11-24T09:00:00+03:00",
            "endDate": "2026-11-26T18:00:00+03:00",
            "eventStatus": "https://schema.org/EventScheduled",
            "eventAttendanceMode": "https://schema.org/MixedEventAttendanceMode",
            "isAccessibleForFree": true,
            "inLanguage": ["en", "ru"],
            "url": "https://spacescitech.com/",
            "image": ["https://spacescitech.com/og-image.jpg"],
            "location": [
              {
                "@type": "Place",
                "name": "RUDN University",
                "address": {
                  "@type": "PostalAddress",
                  "streetAddress": "6 Miklukho-Maklaya Str.",
                  "addressLocality": "Moscow",
                  "postalCode": "117198",
                  "addressCountry": "RU"
                },
                "geo": { "@type": "GeoCoordinates", "latitude": 55.652052, "longitude": 37.499574 }
              },
              { "@type": "VirtualLocation", "url": "https://spacescitech.com/registration/" }
            ],
            "organizer": [
              { "@type": "Organization", "name": "Russian Academy of Sciences", "url": "https://www.ras.ru/" },
              { "@type": "Organization", "name": "International Academy of Astronautics", "url": "https://iaaspace.org/" },
              { "@type": "Organization", "name": "RUDN University", "url": "https://eng.rudn.ru/" }
            ],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "RUB",
              "availability": "https://schema.org/InStock",
              "url": "https://spacescitech.com/registration/"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://spacescitech.com/#website",
            "url": "https://spacescitech.com/",
            "name": "7th SciTech Forum on Space Engineering and Operations Support",
            "inLanguage": "en"
          }
        ]
      }
    </script>
    <script>
      // Loader shows once per browser session; pages rendered for another URL stay hidden until the app mounts.
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        try {
          if (sessionStorage.getItem("sft-boot")) d.classList.add("booted");
          else sessionStorage.setItem("sft-boot", "1");
        } catch (e) {}
        var norm = function (p) { return (p.replace(/\/+$/, "") || "/"); };
        if (window.__SSR_PATH__ !== undefined && norm(window.__SSR_PATH__) !== norm(location.pathname)) d.classList.add("ssr-mismatch");
      })();
    </script>
    <style>
      html { background: #02040b; }
      html.ssr-mismatch #app { visibility: hidden; }
      #boot { display: none; }
      html.js:not(.booted) #boot {
        position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(60% 60% at 50% 45%, #0a1838 0%, #040816 55%, #02040b 100%);
        color: #e8eeff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --hole: 0%;
        -webkit-mask-image: radial-gradient(circle at 50% 44%, transparent var(--hole), #000 calc(var(--hole) + 0.5%));
        mask-image: radial-gradient(circle at 50% 44%, transparent var(--hole), #000 calc(var(--hole) + 0.5%));
      }
      @property --hole { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
      #boot.out { animation: boot-iris 1.15s cubic-bezier(0.76, 0, 0.24, 1) forwards; }
      #boot.out .boot-stage { transition: opacity 0.45s, transform 1s cubic-bezier(0.76, 0, 0.24, 1); opacity: 0; transform: scale(1.35); }
      @keyframes boot-iris { to { --hole: 150%; } }
      .boot-stage { display: flex; flex-direction: column; align-items: center; gap: 30px; }
      .boot-sys { position: relative; width: 220px; height: 220px; perspective: 700px; }
      .boot-planet {
        position: absolute; inset: 72px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #6fb8ff 0%, #1d5fd0 28%, #0a2a6b 60%, #040c24 100%);
        box-shadow: 0 0 40px 6px rgba(77, 163, 255, 0.35), inset -10px -12px 24px rgba(0, 0, 0, 0.55);
        animation: boot-breathe 2.6s ease-in-out infinite;
      }
      .boot-planet::after {
        content: ""; position: absolute; inset: -10px; border-radius: 50%;
        border: 1px solid rgba(94, 240, 255, 0.25); animation: boot-ping 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .boot-ring { position: absolute; inset: 0; transform-style: preserve-3d; }
      .boot-ring > b {
        position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(140, 170, 255, 0.28);
        animation: boot-spin var(--s) linear infinite;
      }
      .boot-ring > b::after {
        content: ""; position: absolute; top: 50%; left: -4px; width: 7px; height: 7px; margin-top: -3.5px;
        border-radius: 50%; background: var(--c); box-shadow: 0 0 14px 3px var(--c);
      }
      .boot-ring.r1 { transform: rotateX(72deg) rotateY(-14deg); --s: 2.4s; --c: #5ef0ff; }
      .boot-ring.r2 { transform: rotateX(72deg) rotateY(38deg) scale(0.82); --s: 3.6s; --c: #ff8a3d; }
      .boot-ring.r3 { transform: rotateX(60deg) rotateY(-62deg) scale(1.12); --s: 5.2s; --c: #a78bfa; }
      .boot-title { font-family: "Segoe UI", system-ui, sans-serif; font-weight: 600; letter-spacing: 0.02em; font-size: 15px; color: #fff; opacity: 0; animation: boot-fade 0.9s 0.2s forwards; }
      .boot-title sup { font-size: 0.6em; }
      .boot-bar { width: 220px; height: 1px; background: rgba(140, 170, 255, 0.18); overflow: hidden; }
      .boot-bar > span { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #5ef0ff, #4da3ff, #a78bfa); box-shadow: 0 0 12px #5ef0ff; }
      .boot-meta { display: flex; width: 220px; justify-content: space-between; font-size: 11px; letter-spacing: 0.22em; color: #66738f; text-transform: uppercase; }
      .boot-meta b { color: #ff8a3d; font-weight: 500; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-breathe { 50% { box-shadow: 0 0 56px 10px rgba(77, 163, 255, 0.45), inset -10px -12px 24px rgba(0, 0, 0, 0.55); } }
      @keyframes boot-ping { from { transform: scale(0.9); opacity: 0.9; } to { transform: scale(1.9); opacity: 0; } }
      @keyframes boot-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-ring > b, .boot-planet, .boot-planet::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-stage">
        <div class="boot-sys">
          <div class="boot-ring r3"><b></b></div>
          <div class="boot-planet"></div>
          <div class="boot-ring r1"><b></b></div>
          <div class="boot-ring r2"><b></b></div>
        </div>
        <div class="boot-title">7<sup>th</sup> SciTech Forum</div>
        <div class="boot-bar"><span id="boot-bar"></span></div>
        <div class="boot-meta"><b>T−</b><span id="boot-pct">000</span></div>
      </div>
    </div>
    <script>
      // Loader progress creeps toward 90% until the app calls __bootFinish().
      (function () {
        if (!document.getElementById("boot") || document.documentElement.classList.contains("booted")) return;
        var p = 0, target = 90, bar = document.getElementById("boot-bar"), pct = document.getElementById("boot-pct");
        function tick() {
          p += (target - p) * (target === 100 ? 0.18 : 0.025);
          if (target === 100 && p > 99.5) p = 100;
          bar.style.transform = "scaleX(" + (p / 100) + ")";
          pct.textContent = ("00" + Math.round(p)).slice(-3);
          if (p < 100) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        window.__bootFinish = function () { target = 100; };
      })();
    </script>
    <div id="app"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
