name: Deploy to Server

on:
    workflow_dispatch:
    push:
        branches: [master]
        paths:
            - ".github/workflows/deploy.yml"
            - "src/**"
            - "public/**"
            - "previous/**"
            - "scripts/**"
            - "index.html"
            - "package.json"
            - "yarn.lock"
            - "vite.config.ts"

# Shares the checkout on the server with the backend deploy; run one at a time.
concurrency:
    group: deploy-server
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup SSH
              run: |
                  sudo apt-get update
                  sudo apt-get install -y sshpass

            - name: Deploy to server
              run: |
                  sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
                  ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
                  set -e
                  echo "Starting deployment..."

                  cd /var/www/spacescitech.com/frontend/
                  # yarn install on the server rewrites yarn.lock; drop that rewrite so the pull applies cleanly.
                  git checkout -- yarn.lock
                  git pull origin master

                  export PATH="$HOME/.nvm/versions/node/v24.9.0/bin:$PATH"

                  echo "Running yarn install..."
                  yarn install

                  echo "Running yarn build..."
                  yarn build

                  echo "Deployment completed successfully!"
                  '
