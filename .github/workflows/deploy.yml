name: Deploy to Server

on:
    workflow_dispatch:
    push:
        branches: [master]
        paths:
            - ".github/workflows/deploy.yml"
            - "src/**"
            - "public/**"
            - "previous/**"
            - "scripts/**"
            - "index.html"
            - "package.json"
            - "yarn.lock"
            - "vite.config.ts"
            - "tsconfig.json"

# Shares the server with the backend deploy; run one at a time.
concurrency:
    group: deploy-server
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: yarn

            # The site is built here, not on the server: the build (tsc, three.js bundle, prerender)
            # needs more memory than the server has, and a long silent SSH session gets dropped.
            - name: Build
              env:
                  # Same value as VITE_API_URL in the server's .env: the API is proxied under /api.
                  VITE_API_URL: /api
              run: |
                  yarn install --frozen-lockfile
                  yarn build

            - name: Setup SSH
              run: |
                  sudo apt-get update
                  sudo apt-get install -y sshpass

            - name: Upload and switch
              env:
                  SSHPASS: ${{ secrets.SERVER_PASSWORD }}
                  TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
              run: |
                  SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=8"

                  # A build started by the old server-side deploy could still be running and would
                  # overwrite dist when it finishes; stop it.
                  $SSH "$TARGET" 'pkill -f "spacescitech.com/frontend/node_modules/(typescript|vite)/" || true'

                  # Unpack next to the live folder, then swap: the site is never served half-written.
                  tar -C dist -czf - . | $SSH "$TARGET" '
                  set -e
                  cd /var/www/spacescitech.com/frontend
                  rm -rf dist.new dist.old
                  mkdir dist.new
                  tar -C dist.new -xzf -
                  if [ -d dist ]; then mv dist dist.old; fi
                  mv dist.new dist
                  rm -rf dist.old
                  echo "Deployment completed successfully!"
                  '
