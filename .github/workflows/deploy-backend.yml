name: Deploy backend

on:
    push:
        branches: [master]
        paths:
            - "backend/**"

# Shares the checkout on the server with the frontend deploy; run one at a time.
concurrency:
    group: deploy-server
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Setup SSH
              run: |
                  sudo apt-get update
                  sudo apt-get install -y sshpass

            - name: Deploy to server
              run: |
                  sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
                  ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
                  set -e
                  echo "Starting backend deployment..."

                  cd /var/www/spacescitech.com/frontend/
                  git pull origin master

                  cd backend
                  # Until the one-time switch from the Go service (backend/README.md) the old service
                  # owns the port; do not start the new one before backend/.env exists.
                  if [ ! -f .env ]; then
                      echo "backend/.env not found: one-time setup not done yet, skipping backend start."
                      exit 0
                  fi
                  docker compose up --build -d

                  echo "Backend deployment completed successfully!"
                  '
